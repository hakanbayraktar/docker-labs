server {
    listen 80;

    # Docker'ın gömülü DNS'i. api container'ı yeniden oluşturulunca IP'si değişebilir;
    # adı değişkenle vermek Nginx'in adı her istekte yeniden çözmesini sağlar.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8000;

    # Arayüz
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # API istekleri
    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /health {
        proxy_pass $api;
    }
}

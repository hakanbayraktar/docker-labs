<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Shop</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 1.5rem; }
    th, td { border-bottom: 1px solid #ddd; padding: .4rem; text-align: left; }
    .beklemede { color: #b26a00; } .hazirlandi { color: #2e7d32; }
  </style>
</head>
<body>
  <h1>Shop</h1>
  <p>Ürün listesinin kaynağı: <span id="source">-</span> | API sürümü: <span id="version">-</span></p>

  <h2>Ürünler</h2>
  <form id="urun">
    <input name="title" placeholder="Ürün adı" required>
    <input name="price" type="number" step="0.01" placeholder="Fiyat" required>
    <button>Ekle</button>
  </form>
  <table id="products"></table>

  <h2>Siparişler</h2>
  <table id="orders"></table>

  <script>
    async function yukle() {
      const p = await (await fetch('/api/v1/products')).json();
      document.getElementById('source').textContent = p.source;
      document.getElementById('products').innerHTML = p.data.map(u =>
        '<tr><td>' + u.id + '</td><td>' + u.title + '</td><td>' + u.price + '</td>' +
        '<td><button onclick="siparis(' + u.id + ')">Sipariş ver</button></td></tr>').join('');
      const o = await (await fetch('/api/v1/orders')).json();
      document.getElementById('orders').innerHTML = o.map(s =>
        '<tr><td>' + s.id + '</td><td>' + s.title + '</td><td>' + s.qty + '</td>' +
        '<td class="' + s.status + '">' + s.status + '</td></tr>').join('');
      const v = await (await fetch('/api/v1/info')).json();
      document.getElementById('version').textContent = v.version;
    }
    async function siparis(id) {
      await fetch('/api/v1/orders?product_id=' + id + '&qty=1', { method: 'POST' });
      yukle();
    }
    document.getElementById('urun').onsubmit = async e => {
      e.preventDefault();
      const f = new FormData(e.target);
      await fetch('/api/v1/products?title=' + encodeURIComponent(f.get('title')) +
        '&price=' + f.get('price'), { method: 'POST' });
      e.target.reset();
      yukle();
    };
    yukle();
    setInterval(yukle, 3000);
  </script>
</body>
</html>
